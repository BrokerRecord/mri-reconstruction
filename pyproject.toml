[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mrirecon"
version = "0.1.0"
description = "Accelerated MRI reconstruction on fastMRI: model-based optimisation (TV + FISTA) and deep learning (U-Net, unrolled networks)"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24", "h5py>=3.8", "scikit-image>=0.21", "matplotlib>=3.7", "pyyaml>=6.0", "tqdm>=4.65"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
