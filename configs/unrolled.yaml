# Unrolled proximal-gradient network: physics (FFT + mask) + learned regulariser
seed: 42
device: auto
output_dir: runs/unrolled

data:
  root: data/singlecoil_val
  split_file: data/splits.json
  skip_edge_slices: 0
  max_train_volumes: null
  max_val_volumes: 10
  num_workers: 2

mask:
  kind: random
  acceleration: 4
  center_fraction: 0.08

model:
  name: unrolled
  num_cascades: 6
  chans: 16
  num_pools: 3
  share_weights: false

train:
  epochs: 3 # the training is too slow, so lower the epochs
  batch_size: 1 # k-space widths differ between volumes
  lr: 0.0005
  weight_decay: 0.0
  lr_step: 15
  lr_gamma: 0.1
  grad_clip: 1.0
